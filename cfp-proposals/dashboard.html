<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFP Dashboard</title>
<style>
:root {
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --text-dim: #484f58;

  --fit-bg: #0d2818;
  --fit-text: #3fb950;
  --pending-bg: #2d2000;
  --pending-text: #d29922;
  --submitted-bg: #051d4d;
  --submitted-text: #388bfd;
  --accepted-bg: #0a3622;
  --accepted-text: #2ea043;
  --rejected-bg: #3d0c0c;
  --rejected-text: #da3633;
  --delivered-bg: #1e0d3c;
  --delivered-text: #8b5cf6;
  --skip-bg: #1a1a1a;
  --skip-text: #484f58;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
  font-size: 13px;
  min-height: 100vh;
}

header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

h1 {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}

.stats {
  display: flex;
  gap: 20px;
}

.stat {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.stat-val {
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
}

.stat-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 2px;
}

.filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.filter-btn {
  padding: 3px 10px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 11px;
  transition: all 0.15s;
}

.filter-btn:hover { border-color: var(--text-muted); color: var(--text); }
.filter-btn.active { border-color: #58a6ff; color: #58a6ff; background: #051d4d; }

.save-indicator {
  font-size: 11px;
  color: var(--text-muted);
  transition: color 0.3s;
}
.save-indicator.saving { color: var(--pending-text); }
.save-indicator.saved { color: var(--accepted-text); }

.main {
  padding: 16px 0;
  overflow-x: auto;
}

.matrix {
  min-width: max-content;
}

.matrix-header {
  display: flex;
  position: sticky;
  top: 89px;
  z-index: 50;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
}

.col-conf-label {
  width: 200px;
  min-width: 200px;
  padding: 8px 12px;
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: var(--bg2);
  position: sticky;
  left: 0;
  z-index: 51;
  border-right: 1px solid var(--border);
}

.col-talk {
  width: 110px;
  min-width: 110px;
  padding: 8px 6px;
  text-align: center;
  line-height: 1.3;
}

.col-talk-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  display: block;
}

.col-talk-fmt {
  font-size: 10px;
  color: var(--text-dim);
}

.region-header {
  display: flex;
  align-items: center;
  background: var(--bg3);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.region-label {
  width: 200px;
  min-width: 200px;
  padding: 6px 12px;
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  position: sticky;
  left: 0;
  background: var(--bg3);
  z-index: 10;
  border-right: 1px solid var(--border);
}

.region-spacer {
  flex: 1;
}

.conf-row {
  display: flex;
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}

.conf-row:hover { background: var(--bg2); }

.conf-name-cell {
  width: 200px;
  min-width: 200px;
  padding: 7px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  position: sticky;
  left: 0;
  background: var(--bg);
  z-index: 10;
  border-right: 1px solid var(--border);
  cursor: default;
  transition: background 0.1s;
}

.conf-row:hover .conf-name-cell { background: var(--bg2); }

.conf-name {
  font-size: 12px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.conf-location {
  font-size: 10px;
  color: var(--text-dim);
  white-space: nowrap;
}

.prior-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accepted-text);
  flex-shrink: 0;
  title: "Previously spoken here";
}

.cfp-badge {
  font-size: 9px;
  color: var(--text-dim);
  white-space: nowrap;
  margin-left: auto;
  text-align: right;
  flex-shrink: 0;
}

.cfp-badge.cfp-open {
  color: var(--pending-text);
  font-weight: 600;
}

.cell {
  width: 110px;
  min-width: 110px;
  padding: 5px 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  transition: filter 0.1s;
  border-right: 1px solid #1c2128;
}

.cell:hover { filter: brightness(1.3); }

.cell.no-fit {
  cursor: default;
  opacity: 0.3;
}

.cell.no-fit:hover { filter: none; }

.cell-inner {
  width: 90px;
  height: 28px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 500;
  transition: all 0.15s;
}

.cell-inner.status-none {
  background: var(--fit-bg);
  color: var(--fit-text);
  border: 1px dashed #2d5a3d;
}

.cell-inner.status-skip {
  background: var(--skip-bg);
  color: var(--skip-text);
  border: 1px solid #2a2a2a;
}

.cell-inner.status-pending {
  background: var(--pending-bg);
  color: var(--pending-text);
  border: 1px solid #5a3e00;
}

.cell-inner.status-submitted {
  background: var(--submitted-bg);
  color: var(--submitted-text);
  border: 1px solid #1a3a6e;
}

.cell-inner.status-accepted {
  background: var(--accepted-bg);
  color: var(--accepted-text);
  border: 1px solid #145c2a;
}

.cell-inner.status-rejected {
  background: var(--rejected-bg);
  color: var(--rejected-text);
  border: 1px solid #6e1a1a;
}

.cell-inner.status-delivered {
  background: var(--delivered-bg);
  color: var(--delivered-text);
  border: 1px solid #3d1a7a;
}

/* Popover */
.popover-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
}

.popover {
  position: fixed;
  z-index: 201;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  width: 280px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}

.popover-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.popover-subtitle {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 12px;
}

.popover-statuses {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
  margin-bottom: 12px;
}

.status-btn {
  padding: 6px 8px;
  border-radius: 5px;
  border: 1px solid transparent;
  cursor: pointer;
  font-size: 11px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: filter 0.1s;
  background: transparent;
  color: var(--text);
}

.status-btn:hover { filter: brightness(1.3); }
.status-btn.active { outline: 2px solid #58a6ff; outline-offset: 1px; }

.status-btn.btn-none      { background: var(--fit-bg);       color: var(--fit-text);       border-color: #2d5a3d; }
.status-btn.btn-skip      { background: var(--skip-bg);      color: var(--skip-text);      border-color: #2a2a2a; }
.status-btn.btn-pending   { background: var(--pending-bg);   color: var(--pending-text);   border-color: #5a3e00; }
.status-btn.btn-submitted { background: var(--submitted-bg); color: var(--submitted-text); border-color: #1a3a6e; }
.status-btn.btn-accepted  { background: var(--accepted-bg);  color: var(--accepted-text);  border-color: #145c2a; }
.status-btn.btn-rejected  { background: var(--rejected-bg);  color: var(--rejected-text);  border-color: #6e1a1a; }
.status-btn.btn-delivered { background: var(--delivered-bg); color: var(--delivered-text); border-color: #3d1a7a; }

.popover-field {
  margin-bottom: 8px;
}

.popover-field label {
  display: block;
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}

.popover-field input,
.popover-field textarea {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  padding: 5px 8px;
  font-size: 12px;
  font-family: inherit;
  resize: vertical;
}

.popover-field textarea {
  min-height: 50px;
  resize: vertical;
}

.popover-actions {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
  margin-top: 10px;
}

.btn {
  padding: 5px 12px;
  border-radius: 5px;
  border: 1px solid var(--border);
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
}

.btn-primary {
  background: #238636;
  color: #fff;
  border-color: #2ea043;
}

.btn-secondary {
  background: var(--bg3);
  color: var(--text-muted);
}

.btn:hover { filter: brightness(1.2); }

/* Legend */
footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  background: var(--bg2);
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.legend {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--text-muted);
}

.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 2px;
}

.dot-none      { background: var(--fit-bg);       border: 1px dashed var(--fit-text); }
.dot-skip      { background: var(--skip-bg);       border: 1px solid #2a2a2a; }
.dot-pending   { background: var(--pending-bg);    border: 1px solid #5a3e00; }
.dot-submitted { background: var(--submitted-bg);  border: 1px solid #1a3a6e; }
.dot-accepted  { background: var(--accepted-bg);   border: 1px solid #145c2a; }
.dot-rejected  { background: var(--rejected-bg);   border: 1px solid #6e1a1a; }
.dot-delivered { background: var(--delivered-bg);  border: 1px solid #3d1a7a; }

.hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>CFP Dashboard</h1>
    <span class="save-indicator" id="saveIndicator">Auto-saved</span>
  </div>
  <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="fit">Fit only</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="submitted">Submitted</button>
      <button class="filter-btn" data-filter="accepted">Accepted</button>
      <button class="filter-btn" data-filter="rejected">Rejected</button>
      <button class="filter-btn" data-filter="delivered">Delivered</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</header>

<div class="main" id="matrixContainer"></div>

<footer>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot dot-none"></div>Fit — no action</div>
    <div class="legend-item"><div class="legend-dot dot-skip"></div>Skip</div>
    <div class="legend-item"><div class="legend-dot dot-pending"></div>Pending</div>
    <div class="legend-item"><div class="legend-dot dot-submitted"></div>Submitted</div>
    <div class="legend-item"><div class="legend-dot dot-accepted"></div>Accepted</div>
    <div class="legend-item"><div class="legend-dot dot-rejected"></div>Rejected</div>
    <div class="legend-item"><div class="legend-dot dot-delivered"></div>Delivered</div>
    <div class="legend-item" style="margin-left:8px;">
      <span style="color:var(--accepted-text);font-size:11px;">●</span> Prior speaker
    </div>
  </div>
</footer>

<!-- Popover -->
<div class="popover-overlay hidden" id="overlay" onclick="closePopover()"></div>
<div class="popover hidden" id="popover">
  <div class="popover-title" id="popoverTitle"></div>
  <div class="popover-subtitle" id="popoverSubtitle"></div>
  <div class="popover-statuses" id="popoverStatuses"></div>
  <div class="popover-field">
    <label>Notes</label>
    <textarea id="popoverNotes" rows="2" placeholder="Optional notes..."></textarea>
  </div>
  <div class="popover-field">
    <label>Submitted date</label>
    <input type="date" id="popoverDateSubmitted">
  </div>
  <div class="popover-field">
    <label>Decision date</label>
    <input type="date" id="popoverDateDecision">
  </div>
  <div class="popover-actions">
    <button class="btn btn-secondary" onclick="closePopover()">Cancel</button>
    <button class="btn btn-primary" onclick="savePopover()">Save</button>
  </div>
</div>

<script>
const STATUSES = [
  { id: 'none',      label: 'Fit',        icon: '✓',  cls: 'btn-none' },
  { id: 'skip',      label: 'Skip',       icon: '–',  cls: 'btn-skip' },
  { id: 'pending',   label: 'Pending',    icon: '◷',  cls: 'btn-pending' },
  { id: 'submitted', label: 'Submitted',  icon: '→',  cls: 'btn-submitted' },
  { id: 'accepted',  label: 'Accepted',   icon: '✓',  cls: 'btn-accepted' },
  { id: 'rejected',  label: 'Rejected',   icon: '✗',  cls: 'btn-rejected' },
  { id: 'delivered', label: 'Delivered',  icon: '★',  cls: 'btn-delivered' },
];

let data = null;
let activeFilter = 'all';
let popoverState = { talkId: null, confId: null, status: 'none' };
let saveTimer = null;

async function loadData() {
  const res = await fetch('/data');
  data = await res.json();
  renderStats();
  renderMatrix();
}

function getSubmission(talkId, confId) {
  if (!data.submissions) return null;
  return data.submissions.find(s => s.talk_id === talkId && s.conference_id === confId) || null;
}

function isFit(talkId, confId) {
  return (data.fit[talkId] || []).includes(confId);
}

function getEffectiveStatus(talkId, confId) {
  const sub = getSubmission(talkId, confId);
  return sub ? sub.status : 'none';
}

function scheduleSave() {
  clearTimeout(saveTimer);
  const ind = document.getElementById('saveIndicator');
  ind.textContent = 'Saving…';
  ind.className = 'save-indicator saving';
  saveTimer = setTimeout(async () => {
    try {
      const res = await fetch('/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      if (res.ok) {
        ind.textContent = 'Saved';
        ind.className = 'save-indicator saved';
        setTimeout(() => { ind.textContent = 'Auto-saved'; ind.className = 'save-indicator'; }, 1500);
      }
    } catch (e) {
      ind.textContent = 'Save failed';
      ind.className = 'save-indicator';
    }
  }, 600);
}

function renderStats() {
  const subs = data.submissions || [];
  const counts = { pending: 0, submitted: 0, accepted: 0, rejected: 0, delivered: 0 };
  subs.forEach(s => { if (counts[s.status] !== undefined) counts[s.status]++; });
  document.getElementById('stats').innerHTML = `
    <div class="stat"><span class="stat-val">${data.talks.length}</span><span class="stat-label">Talks</span></div>
    <div class="stat"><span class="stat-val">${data.conferences.length}</span><span class="stat-label">Conferences</span></div>
    <div class="stat" style="color:var(--pending-text)"><span class="stat-val">${counts.pending}</span><span class="stat-label">Pending</span></div>
    <div class="stat" style="color:var(--submitted-text)"><span class="stat-val">${counts.submitted}</span><span class="stat-label">Submitted</span></div>
    <div class="stat" style="color:var(--accepted-text)"><span class="stat-val">${counts.accepted}</span><span class="stat-label">Accepted</span></div>
    <div class="stat" style="color:var(--delivered-text)"><span class="stat-val">${counts.delivered}</span><span class="stat-label">Delivered</span></div>
  `;
}

function shouldShowRow(confId) {
  if (activeFilter === 'all') return true;
  if (activeFilter === 'fit') return data.talks.some(t => isFit(t.id, confId));
  return data.talks.some(t => {
    const sub = getSubmission(t.id, confId);
    return sub && sub.status === activeFilter;
  });
}

function isConfRowVisible(confId) {
  const row = document.querySelector(`.conf-row[data-conf="${confId}"]`);
  return row && !row.classList.contains('hidden');
}

function renderMatrix() {
  const container = document.getElementById('matrixContainer');

  // Header row
  const headerCols = data.talks.map(t => `
    <div class="col-talk">
      <span class="col-talk-title">${e(t.short || t.title)}</span>
      <span class="col-talk-fmt">${e(t.format)}</span>
    </div>
  `).join('');

  let html = `
    <div class="matrix">
      <div class="matrix-header">
        <div class="col-conf-label">Conference</div>
        ${headerCols}
      </div>
  `;

  // Group conferences by region
  const regionOrder = data.regions.map(r => r.id);
  const byRegion = {};
  data.conferences.forEach(c => {
    if (!byRegion[c.region]) byRegion[c.region] = [];
    byRegion[c.region].push(c);
  });

  regionOrder.forEach(regionId => {
    const confs = byRegion[regionId] || [];
    if (!confs.length) return;
    const region = data.regions.find(r => r.id === regionId);

    const confRows = confs.map(conf => {
      const cells = data.talks.map(talk => {
        const fit = isFit(talk.id, conf.id);
        const sub = getSubmission(talk.id, conf.id);
        const status = sub ? sub.status : 'none';
        const s = STATUSES.find(x => x.id === status) || STATUSES[0];
        if (!fit) {
          return `<div class="cell no-fit" title="Not a recommended fit"><div class="cell-inner" style="opacity:0"></div></div>`;
        }
        return `
          <div class="cell" data-talk="${e(talk.id)}" data-conf="${e(conf.id)}" onclick="openPopover(event, '${e(talk.id)}', '${e(conf.id)}')">
            <div class="cell-inner status-${status}">${s.icon} ${s.label}</div>
          </div>
        `;
      }).join('');

      const cfpInfo = conf.cfp_closes ? `CFP: ${conf.cfp_opens}–${conf.cfp_closes}` : '';
      const cfpOpen = isCfpOpen(conf);
      const cfpClass = cfpOpen ? 'cfp-badge cfp-open' : 'cfp-badge';
      const cfpText = cfpOpen ? `⚡ CFP open` : cfpInfo;

      const hidden = shouldShowRow(conf.id) ? '' : ' hidden';

      return `
        <div class="conf-row${hidden}" data-conf="${e(conf.id)}">
          <div class="conf-name-cell" title="${e(conf.location)} | ${cfpInfo}">
            ${conf.prior ? '<div class="prior-dot" title="Previously spoken here"></div>' : ''}
            <div>
              <div class="conf-name">${e(conf.name)}</div>
              <div class="conf-location">${e(conf.location)}</div>
            </div>
            <div class="${cfpClass}">${cfpText}</div>
          </div>
          ${cells}
        </div>
      `;
    }).join('');

    const anyVisible = confs.some(c => shouldShowRow(c.id));
    const regionHidden = anyVisible ? '' : ' hidden';

    html += `
      <div class="region-header${regionHidden}">
        <div class="region-label">${e(region ? region.label : regionId)}</div>
        <div class="region-spacer"></div>
      </div>
      ${confRows}
    `;
  });

  html += '</div>';
  container.innerHTML = html;
}

function isCfpOpen(conf) {
  // Very rough heuristic — marks open if cfp_closes month is >= current month
  const months = { january:1, february:2, march:3, april:4, may:5, june:6,
                   july:7, august:8, september:9, october:10, november:11, december:12 };
  const now = new Date();
  const closes = (conf.cfp_closes || '').toLowerCase();
  for (const [name, num] of Object.entries(months)) {
    if (closes.includes(name) && num >= (now.getMonth() + 1)) return true;
  }
  return false;
}

// Popover
function openPopover(evt, talkId, confId) {
  evt.stopPropagation();
  const talk = data.talks.find(t => t.id === talkId);
  const conf = data.conferences.find(c => c.id === confId);
  const sub = getSubmission(talkId, confId);
  const currentStatus = sub ? sub.status : 'none';

  popoverState = { talkId, confId, status: currentStatus };

  document.getElementById('popoverTitle').textContent = `${conf.name} × ${talk.short || talk.title}`;
  document.getElementById('popoverSubtitle').textContent = `${conf.location} | ${conf.event_month} | CFP: ${conf.cfp_opens}–${conf.cfp_closes}`;
  document.getElementById('popoverNotes').value = sub ? (sub.notes || '') : '';
  document.getElementById('popoverDateSubmitted').value = sub ? (sub.dates?.submitted || '') : '';
  document.getElementById('popoverDateDecision').value = sub ? (sub.dates?.decision || '') : '';

  const statusBtns = STATUSES.map(s => `
    <button class="status-btn ${s.cls}${s.id === currentStatus ? ' active' : ''}"
            onclick="selectStatus('${s.id}')" data-status="${s.id}">
      ${s.icon} ${s.label}
    </button>
  `).join('');
  document.getElementById('popoverStatuses').innerHTML = statusBtns;

  // Position popover near click
  const pop = document.getElementById('popover');
  pop.classList.remove('hidden');
  document.getElementById('overlay').classList.remove('hidden');

  const rect = evt.currentTarget.getBoundingClientRect();
  let left = rect.left;
  let top = rect.bottom + 6;

  const pw = 280, ph = 320;
  if (left + pw > window.innerWidth - 10) left = window.innerWidth - pw - 10;
  if (top + ph > window.innerHeight - 10) top = rect.top - ph - 6;

  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
}

function selectStatus(statusId) {
  popoverState.status = statusId;
  document.querySelectorAll('#popoverStatuses .status-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.status === statusId);
  });
}

function savePopover() {
  const { talkId, confId, status } = popoverState;
  const notes = document.getElementById('popoverNotes').value.trim();
  const dateSubmitted = document.getElementById('popoverDateSubmitted').value;
  const dateDecision = document.getElementById('popoverDateDecision').value;

  if (!data.submissions) data.submissions = [];
  let sub = data.submissions.find(s => s.talk_id === talkId && s.conference_id === confId);
  if (!sub) {
    sub = { talk_id: talkId, conference_id: confId, status: 'none', notes: '', dates: {} };
    data.submissions.push(sub);
  }
  sub.status = status;
  sub.notes = notes;
  if (!sub.dates) sub.dates = {};
  sub.dates.submitted = dateSubmitted || null;
  sub.dates.decision = dateDecision || null;

  // Remove if reset to none with no extra info
  if (status === 'none' && !notes && !dateSubmitted && !dateDecision) {
    data.submissions = data.submissions.filter(s => !(s.talk_id === talkId && s.conference_id === confId));
  }

  closePopover();
  scheduleSave();
  renderStats();
  renderMatrix();
}

function closePopover() {
  document.getElementById('popover').classList.add('hidden');
  document.getElementById('overlay').classList.add('hidden');
}

// Filters
document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  activeFilter = btn.dataset.filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
  renderMatrix();
});

function e(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadData();
</script>
